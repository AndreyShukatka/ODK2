{% extends 'base.html' %}{% block content %}
<div class="bg-[#181b22] border border-gray-800 rounded-2xl p-6 max-w-xl mx-auto">
<h2 class="font-bold text-xl mb-4">Регистрация</h2>
{% if error %}<div class="bg-red-900/40 border border-red-700 rounded-xl px-4 py-3 text-sm mb-4">{{ error }}</div>{% endif %}

<form method="post" class="space-y-3">{% csrf_token %}
<div class="grid grid-cols-1 gap-3">
<input name="last_name" value="{{ data.last_name }}" required placeholder="Фамилия *" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
<input name="first_name" value="{{ data.first_name }}" required placeholder="Имя *" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
<input name="middle_name" value="{{ data.middle_name }}" required placeholder="Отчество *" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>

<hr class="border-gray-800 my-3">

<input name="username" value="{{ data.username }}" required placeholder="Логин для входа *" class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
<input name="password" type="password" required placeholder="Пароль *" class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">

<div class="grid grid-cols-2 gap-3">
<select name="role" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
<option value="cnc_operator">Оператор ЧПУ</option>
<option value="cnc_adjuster">Наладчик ЧПУ</option>
<option value="operator">Оператор</option>
<option value="employee">Сотрудник</option>
</select>
<select name="pay_type" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
<option value="piecework">Сдельщик</option>
<option value="hourly">Повременщик</option>
</select>
</div>
<input name="hourly_rate" value="{{ data.hourly_rate }}" placeholder="Ставка 400" class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">

<button class="w-full bg-white text-black rounded-xl py-3 font-bold">Создать аккаунт</button>
</form>
</div>
{% endblock %}
