{% extends 'base.html' %}{% block content %}
<div class="bg-[#181b22] border border-gray-800 rounded-2xl p-6 max-w-2xl">
<h2 class="font-bold text-xl mb-4">Новый график — выбери сотрудников</h2>
<form method="post" class="space-y-4">{% csrf_token %}
<div class="grid grid-cols-3 gap-3">
<input name="brigade_no" value="4" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-2" placeholder="Бригада №">
<input name="month" type="number" value="10" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-2">
<input name="year" type="number" value="2026" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-2">
</div>
<input name="norm_hours" value="176" class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-2" placeholder="Норма Ур.">

<div class="border border-gray-700 rounded-xl p-3 max-h-80 overflow-auto space-y-2">
{% for u in employees %}
<label class="flex gap-3 text-sm items-center bg-[#0f1115] border border-gray-800 rounded-xl px-3 py-3 cursor-pointer hover:border-gray-600">
<input type="checkbox" name="employees" value="{{ u.id }}" checked class="w-4 h-4">
<span class="font-bold text-white">{{ u.profile.short_name }}</span>
{% if not u.first_name %}<span class="text-red-400 text-xs">— нет ФИО (пересоздай пользователя)</span>{% endif %}
</label>
{% empty %}
<p class="text-sm text-gray-500">Нет зарегистрированных</p>
{% endfor %}
</div>

<button class="w-full bg-white text-black rounded-xl py-3 font-bold">Создать таблицу</button>
</form>
</div>
{% endblock %}
