{% extends 'base.html' %}{% block content %}
<h1 class="text-2xl font-bold mb-4">Журнал — кто что закрывал</h1>
<form method="get" class="bg-[#181b22] border border-gray-800 rounded-2xl p-4 flex flex-wrap gap-3 mb-6">
<select name="user" class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-2 text-sm">
<option value="">Все пользователи</option>
{% for u in users %}<option value="{{ u.id }}">{{ u.username }}</option>{% endfor %}
</select>
<button class="bg-white text-black rounded-xl px-4 py-2 text-sm font-bold">Показать</button>
<a href="/journal/" class="text-sm text-gray-500 py-2">Сбросить</a>
</form>
<div class="bg-[#181b22] border border-gray-800 rounded-2xl overflow-hidden">
<table class="w-full text-sm"><tbody>{% for r in records %}<tr><td class="px-4 py-3">{{ r.kit.detail.number }} [{{ r.kit.kit_number }}] Оп.{{ r.operation.number }} {{ r.percent }}%</td></tr>{% endfor %}</tbody></table>
</div>
{% endblock %}
