{% extends 'base.html' %}{% block content %}<div class='max-w-lg mx-auto bg-[#181b22] border rounded-2xl p-8'><h1 class='text-xl font-bold mb-2'>Новый комплект</h1><p class='text-sm text-gray-500 mb-6'>1 деталь = 1 комплект. Номер эксклюзивен для детали. Если закрыт на 100% — повторно нельзя.</p>{% if error %}<div class='bg-red-900/30 border rounded-xl p-3 text-sm mb-4'>{{ error }}</div>{% endif %}<form method='post' class='space-y-4'>{% csrf_token %}<select name='detail' required class='w-full bg-[#0f1115] border rounded-xl px-4 py-3'>{% for d in details %}<option value='{{ d.id }}'>{{ d.number }} {{ d.name }}</option>{% endfor %}</select><input name='kit_number' placeholder='Номер комплекта КМП-001' required class='w-full bg-[#0f1115] border rounded-xl px-4 py-3'><button class='w-full bg-white text-black rounded-xl py-3 font-bold'>Создать комплект</button></form></div>{% endblock %}
