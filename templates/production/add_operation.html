{% extends 'base.html' %}{% block content %}
<div class="bg-[#181b22] border border-gray-800 rounded-2xl p-6 max-w-md">
<h2 class="font-bold mb-4">+ Добавить операцию</h2>
<form method="post" class="space-y-4">{% csrf_token %}
<select name="detail" required class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
<option value="">— выбери деталь —</option>
{% for d in details %}<option value="{{ d.id }}">{{ d.number }} — {{ d.name }}</option>{% endfor %}
</select>
<input name="number" type="number" placeholder="№ операции 45" required class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
<input name="name" placeholder="Название Токарка" required class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">

<div class="space-y-2">
<label class="text-xs text-gray-500 font-bold">Норма времени на 100%</label>
<div class="grid grid-cols-2 gap-3">
<div>
<label class="text- text-gray-500">Часы</label>
<input name="hours" type="number" min="0" max="100" value="0" class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>
<div>
<label class="text- text-gray-500">Минуты</label>
<input name="minutes" type="number" min="0" max="59" value="30" class="w-full bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-3 text-sm">
</div>
</div>
<p class="text- text-gray-500">Пример: 1 час 30 минут = 90 мин на 100%. При закрытии 10% спишется 9 мин.</p>
</div>

<button class="w-full bg-white text-black rounded-xl py-3 font-bold">Добавить</button>
</form>
</div>
{% endblock %}
