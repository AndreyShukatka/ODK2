{% extends 'base.html' %}{% block content %}<h1 class='text-2xl font-bold mb-6'>Доступы</h1><div class='grid grid-cols-2 gap-6'><div class='bg-[#181b22] border rounded-2xl p-6'><h2 class='font-bold mb-3'>Я дал</h2>{% for g in given %}<div class='flex justify-between bg-[#0f1115] p-3 rounded-xl mb-2 text-sm'><span>{{ g.grantee.username }}</span><a href='/accounts/revoke/{{ g.id }}/' class='text-red-400'>x</a></div>{% empty %}<p class='text-gray-500 text-sm'>Никому</p>{% endfor %}<form method='post' action='/accounts/grant/' class='mt-4 flex gap-2'>{% csrf_token %}<select name='grantee' class='flex-1 bg-[#0f1115] border rounded-xl px-3 py-2'>{% for u in users %}<option value='{{ u.id }}'>{{ u.username }}</option>{% endfor %}</select><button class='bg-white text-black px-4 rounded-xl text-sm font-bold'>Дать</button></form></div><div class='bg-[#181b22] border rounded-2xl p-6'><h2 class='font-bold mb-3'>Мне дали</h2>{% for g in received %}<a href='/shared/{{ g.granter.id }}/' class='block bg-[#0f1115] p-3 rounded-xl mb-2 text-sm underline'>{{ g.granter.username }}</a>{% empty %}<p class='text-gray-500 text-sm'>Нет</p>{% endfor %}</div></div>{% endblock %}
