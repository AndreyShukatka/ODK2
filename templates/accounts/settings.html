{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-[#181b22] border border-gray-800 rounded-2xl p-6">
  <h1 class="text-xl font-bold mb-4">Моя ставка</h1>
  <p class="text-sm text-gray-500 mb-4">Текущая: {{ profile.hourly_rate }} ₽/ч</p>
  <form method="post" class="flex gap-2">
    {% csrf_token %}
    <input type="number" name="hourly_rate" value="{{ profile.hourly_rate }}" step="10" min="50" max="10000" class="flex-1 bg-[#0f1115] border border-gray-700 rounded-xl px-4 py-3">
    <button class="bg-white text-black rounded-xl px-6 font-bold">Сохранить</button>
  </form>
</div>
{% endblock %}
