{% extends 'base.html' %}{% block content %}
<div class="flex justify-between mb-6">
<h1 class="text-2xl font-bold">Графики</h1>
<a href="/schedule/create/" class="bg-white text-black px-4 py-2 rounded-xl font-bold">+ Создать график</a>
</div>
<div class="bg-[#181b22] border border-gray-800 rounded-2xl p-5">
{% for s in schedules %}
<div class="flex justify-between border-b border-gray-800 py-3">
<div>Бригада №{{ s.brigade_no }} на {{ s.month }}/{{ s.year }} — норма {{ s.norm_hours }}ч</div>
<div class="flex gap-3">
<a href="/schedule/{{ s.id }}/" class="text-white underline">Открыть</a>
<a href="/schedule/{{ s.id }}/excel/" class="text-gray-400">Excel</a>
</div>
</div>
{% empty %}Пока нет{% endfor %}
</div>
{% endblock %}
