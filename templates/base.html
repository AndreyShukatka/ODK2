<!DOCTYPE html>
<html lang='ru'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>ОДК</title>
<script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-[#0f1115] text-gray-100 min-h-screen'>
<nav class='border-b border-gray-800 bg-[#151821] sticky top-0 z-50'>
<div class='max-w-7xl mx-auto px-6 py-3 flex justify-between items-center'>
<a href='/' class='font-black'>ОДК • ЦЕХ</a>
<div class='flex gap-4 text-sm items-center'>
{% if user.is_authenticated %}
<a href='/' class='text-gray-400'>Смена</a>
<a href='/schedule/' class='text-white font-bold border border-gray-700 px-3 py-1 rounded-lg'>График</a>
<a href='/journal/' class='text-gray-400'>Журнал</a>
<a href='/accounts/profile/' class='text-gray-400'>Доступы</a>
<div class="bg-[#0f1115] border border-gray-700 rounded-xl px-3 py-1">
<span class="text-white font-bold text-">{{ user.profile.short_name }}</span>
</div>
<a href='/accounts/logout/' class='text-red-400 ml-2'>Выйти</a>
{% else %}
<a href='/accounts/login/'>Войти</a>
<a href='/accounts/register/'>Регистрация</a>
{% endif %}
</div>
</div>
</nav>
<main class='max-w-7xl mx-auto px-6 py-8'>
{% block content %}{% endblock %}
</main>
</body>
</html>
